<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BTC Registration</title>
<style>
  :root{--bg:#0b0b0b;--glass:rgba(255,255,255,.06);--gold:#f0c24b}
  *{box-sizing:border-box;font-family:Inter,system-ui,Arial}
  body{
    margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#050506,#141416 70%);
    color:#fff;overflow:hidden;
  }
  .bg{position:fixed;inset:0;opacity:.04;background-image:url('https://cryptologos.cc/logos/bitcoin-btc-logo.png');background-repeat:repeat;background-size:120px;animation:move 25s linear infinite}
  @keyframes move{from{background-position:0 0}to{background-position:1500px 1500px}}
  .card{width:360px;padding:22px;border-radius:14px;background:var(--glass);box-shadow:0 6px 30px rgba(0,0,0,.7);backdrop-filter:blur(6px)}
  h2{color:var(--gold);margin:0 0 14px;text-align:center}
  input,select,button{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:0;background:rgba(255,255,255,.06);color:#fff}
  .small{font-size:13px;color:#ddd;margin-top:6px;text-align:center}
  button{background:var(--gold);color:#000;font-weight:700;cursor:pointer}
  .msg{height:18px;text-align:center;font-size:14px;margin-top:6px}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <h2>Bitcoin Portal — Register</h2>
    <input id="fname" placeholder="First name" />
    <input id="lname" placeholder="Last name" />
    <input id="mobile" placeholder="Mobile number" inputmode="numeric" />
    <input id="email" placeholder="Email address" type="email" />
    <input id="password" placeholder="Password" type="password" />
    <input id="repassword" placeholder="Re-enter password" type="password" />
    <select id="role">
      <option value="">Select role</option>
      <option value="BankManager">Bank Manager</option>
      <option value="Employee">Employee</option>
    </select>

    <button id="btnRegister">Register</button>
    <div class="msg" id="msg"></div>
    <div class="small">Already registered? <a style="color:var(--gold)" href="login.html">Login</a></div>
  </div>

<script>
/* --- storage helpers --- */
function loadUsers(){ try { return JSON.parse(localStorage.getItem('btc_users')||'[]') } catch(e){return []} }
function saveUsers(u){ localStorage.setItem('btc_users', JSON.stringify(u)) }

function genAccountNo(){ return 'BTC' + Math.floor(100000 + Math.random()*900000) }
function genCustomerID(){ return 'CID' + Math.floor(1000 + Math.random()*9000) }
function genEmployeeID(){ return 'EID' + Math.floor(1000 + Math.random()*9000) }

/* --- registration --- */
document.getElementById('btnRegister').addEventListener('click', () => {
  const fname = document.getElementById('fname').value.trim()
  const lname = document.getElementById('lname').value.trim()
  const mobile = document.getElementById('mobile').value.trim()
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const repass = document.getElementById('repassword').value
  const role = document.getElementById('role').value
  const msg = document.getElementById('msg')

  if(!fname||!lname||!mobile||!email||!password||!repass||!role){
    msg.style.color='salmon'; msg.textContent='Fill all fields'
    return
  }
  if(password !== repass){ msg.style.color='salmon'; msg.textContent='Passwords do not match'; return }

  const users = loadUsers()
  if(users.some(u=>u.mobile===mobile)){ msg.style.color='salmon'; msg.textContent='Mobile already registered'; return }

  // auto-generate
  const accountNo = genAccountNo()
  const id = role === 'BankManager' ? genCustomerID() : genEmployeeID()

  const user = {
    fname, lname, mobile, email, password, role, accountNo, id, balance:0, created: new Date().toISOString()
  }
  users.push(user)
  saveUsers(users)
  msg.style.color='#b9f6c1'; msg.textContent='Registered — redirecting to login...'
  setTimeout(()=> location.href='login.html', 900)
})
</script>
</body>
</html>
