<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bitcoin Portal</title>
<style>
  body{
    margin:0;height:100vh;
    background:linear-gradient(135deg,#030305,#121214);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:Inter
  }
  .bg{position:fixed;inset:0;opacity:.04;
    background-image:url('https://cryptologos.cc/logos/bitcoin-btc-logo.png');
    background-repeat:repeat;background-size:120px;
    animation:move 25s linear infinite}
  @keyframes move{from{background-position:0 0}to{background-position:1500px 1500px}}
  .card{
    background:rgba(255,255,255,.05);
    border-radius:12px;padding:24px;width:380px;text-align:center;
    backdrop-filter:blur(6px);box-shadow:0 0 25px rgba(0,0,0,.7)
  }
  h2{color:#f0c24b;margin-bottom:10px}
  p{margin:8px 0;color:#ffeb99}
  .balance{font-size:26px;font-weight:700;color:#b9f6c1}
  a,button{margin-top:14px;display:inline-block;padding:10px 16px;
    border-radius:8px;text-decoration:none;font-weight:700;border:0;cursor:pointer}
  button{background:#f0c24b;color:#000}
  a{background:transparent;border:1px solid #f0c24b;color:#f0c24b}
  .refresh{animation:spin 1.5s linear infinite;display:inline-block;margin-left:5px}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card" id="profileCard">
  <h2>Welcome — Bitcoin Portal</h2>
  <div id="profile"></div>
  <div style="margin-top:18px">
    <button id="btnRefresh">🔄 Refresh</button>
    <button id="btnLogout">Logout</button><br><br>
    <a href="deposit.html">Deposit Balance</a>
  </div>
</div>

<script>
function loadUsers(){ try{return JSON.parse(localStorage.getItem('btc_users')||'[]')}catch(e){return[]} }
function saveUsers(u){ localStorage.setItem('btc_users', JSON.stringify(u)) }
function getLogged(){ try{return JSON.parse(localStorage.getItem('btc_logged')||'null')}catch(e){return null} }
function setLogged(u){ localStorage.setItem('btc_logged', JSON.stringify(u)) }

const logged = getLogged()
const profile = document.getElementById('profile')

if(!logged){ alert('Please login first'); location.href='login.html' }

function updateProfile(){
  const users = loadUsers()
  const fresh = users.find(u=>u.accountNo===logged.accountNo)
  if(fresh){
    setLogged(fresh)
    profile.innerHTML = `
      <p><strong>Name:</strong> ${fresh.fname} ${fresh.lname}</p>
      <p><strong>Role:</strong> ${fresh.role}</p>
      <p><strong>Mobile:</strong> ${fresh.mobile}</p>
      <p class="balance">Balance: ${(fresh.balance||0).toFixed(2)} USD</p>
      <p><strong>Account:</strong> ${fresh.accountNo}</p>
      <p><strong>ID:</strong> ${fresh.id}</p>
    `
  }
}
updateProfile()

document.getElementById('btnRefresh').addEventListener('click',()=>{
  const btn=document.getElementById('btnRefresh')
  btn.innerHTML='🔁 <span class="refresh">⟳</span> Refreshing...'
  setTimeout(()=>{
    updateProfile()
    btn.textContent='🔄 Refresh'
  },600)
})

document.getElementById('btnLogout').addEventListener('click',()=>{
  localStorage.removeItem('btc_logged')
  location.href='login.html'
})
</script>
</body>
</html>
