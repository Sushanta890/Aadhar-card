<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BTC Login</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#050506,#111);color:#fff}
  .bg{position:fixed;inset:0;opacity:.04;background-image:url('https://cryptologos.cc/logos/bitcoin-btc-logo.png');background-repeat:repeat;background-size:120px;animation:move 25s linear infinite}
  @keyframes move{from{background-position:0 0}to{background-position:1500px 1500px}}
  .box{width:340px;padding:22px;border-radius:12px;background:rgba(255,255,255,.06);backdrop-filter:blur(6px)}
  h2{color:#f0c24b;margin:0 0 12px;text-align:center}
  input,button{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:0;background:rgba(255,255,255,.05);color:#fff}
  button{background:#f0c24b;color:#000;font-weight:700;cursor:pointer}
  .msg{text-align:center;height:18px;margin-top:6px}
  .hint{text-align:center;color:#ddd;font-size:13px;margin-top:8px}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="box">
    <h2>Bitcoin Portal — Login</h2>
    <input id="acctid" placeholder="Account number OR Employee/Customer ID" />
    <input id="password" placeholder="Password" type="password" />
    <button id="btnLogin">Login</button>
    <div class="msg" id="msg"></div>
    <div class="hint">New? <a href="registration.html" style="color:#f0c24b">Register here</a> • <a href="search.html" style="color:#f0c24b">Search account</a></div>
  </div>

<script>
function loadUsers(){ try { return JSON.parse(localStorage.getItem('btc_users')||'[]') } catch(e){return []} }
document.getElementById('btnLogin').addEventListener('click', ()=>{
  const key = document.getElementById('acctid').value.trim()
  const pass = document.getElementById('password').value
  const msg = document.getElementById('msg')
  if(!key||!pass){ msg.style.color='salmon'; msg.textContent='Enter both fields'; return }
  const users = loadUsers()
  const user = users.find(u => u.accountNo === key || u.id === key || u.mobile === key)
  if(!user){ msg.style.color='salmon'; msg.textContent='User not found'; return }
  if(user.password !== pass){ msg.style.color='salmon'; msg.textContent='Incorrect password'; return }
  // set session
  localStorage.setItem('btc_logged', JSON.stringify(user))
  msg.style.color='#b9f6c1'; msg.textContent='Login successful'
  setTimeout(()=> location.href='home.html', 700)
})
</script>
</body>
</html>
