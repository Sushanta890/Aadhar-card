<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Find My Account | Bitcoin Portal</title>
<style>
:root{--bg:#0b0b0b;--glass:rgba(255,255,255,.08);--gold:#f0c24b}
*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{
  margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#050506,#141416 70%);
  color:#fff;overflow:hidden;
}
.bg{position:fixed;inset:0;opacity:.04;
  background-image:url('https://cryptologos.cc/logos/bitcoin-btc-logo.png');
  background-repeat:repeat;background-size:120px;
  animation:move 25s linear infinite}
@keyframes move{from{background-position:0 0}to{background-position:1500px 1500px}}
.card{
  width:370px;padding:22px;border-radius:14px;
  background:var(--glass);box-shadow:0 6px 30px rgba(0,0,0,.7);
  backdrop-filter:blur(6px);overflow-y:auto;max-height:95vh;
}
h2{color:var(--gold);margin:0 0 14px;text-align:center}
input,button{
  width:100%;padding:10px;margin:8px 0;border-radius:8px;border:0;
  background:rgba(255,255,255,.06);color:#fff
}
button{
  background:var(--gold);color:#000;font-weight:700;cursor:pointer;
  transition:.3s
}
button:hover{transform:scale(1.03)}
.resultBox{
  background:rgba(255,255,255,.05);
  border-radius:8px;padding:10px;margin-top:8px;text-align:center;
}
a{color:var(--gold);text-decoration:none;font-size:13px}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <h2>Find My Account</h2>
  <input id="findEmail" type="email" placeholder="Enter registered email" />
  <button id="btnFind">Show Account Details</button>
  <div class="resultBox" id="result"></div>
  <div style="text-align:center;margin-top:10px;">
    <a href="Bitcoin Portal — Register.html">⬅ Back to Register</a>
  </div>
</div>

<script>
function loadUsers(){ 
  try{return JSON.parse(localStorage.getItem('btc_customers')||'[]')}catch(e){return[]} 
}

document.getElementById('btnFind').addEventListener('click',()=>{
  const email=document.getElementById('findEmail').value.trim()
  const result=document.getElementById('result')
  if(!email){result.style.color='salmon';result.textContent='Please enter your email';return}
  const users=loadUsers()
  const user=users.find(u=>u.email===email)
  if(!user){
    result.style.color='salmon';result.textContent='No account found for this email'
  } else {
    result.style.color='#b9f6c1'
    result.innerHTML=`<p><b>Name:</b> ${user.fname} ${user.lname}</p>
                      <p><b>Account No:</b> ${user.accountNo}</p>
                      <p><b>PIN Code:</b> ${user.pin}</p>`
  }
})
</script>
</body>
</html>
