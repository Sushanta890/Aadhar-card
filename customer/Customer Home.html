<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bitcoin Portal — Home</title>
<style>
:root{
  --bg:#0b0b0b;
  --glass:rgba(255,255,255,.08);
  --gold:#f0c24b;
}
*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#050506,#141416 70%);
  color:#fff;
  overflow:hidden;
}
.bg{
  position:fixed;
  inset:0;
  opacity:.05;
  background-image:url('https://cryptologos.cc/logos/bitcoin-btc-logo.png');
  background-repeat:repeat;
  background-size:120px;
  animation:move 25s linear infinite;
}
@keyframes move{
  from{background-position:0 0}
  to{background-position:1500px 1500px}
}
.card{
  width:340px;
  background:var(--glass);
  backdrop-filter:blur(6px);
  border-radius:18px;
  box-shadow:0 8px 35px rgba(0,0,0,.7);
  text-align:center;
  padding:30px 25px;
}
h1{
  color:var(--gold);
  margin-bottom:10px;
  font-size:24px;
}
p{
  font-size:14px;
  color:#ccc;
  margin-bottom:25px;
}
button{
  width:100%;
  background:var(--gold);
  color:#000;
  border:none;
  padding:12px;
  border-radius:10px;
  font-weight:700;
  margin:8px 0;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  transform:scale(1.05);
}
.small{
  font-size:13px;
  color:#aaa;
  margin-top:10px;
}
</style>
</head>
<body>
<div class="bg"></div>

<div class="card">
  <h1>🪙 Bitcoin Portal</h1>
  <p>Welcome to your secure crypto-style banking system.<br>Choose an option below:</p>

  <button onclick="location.href='Bitcoin Portal — Register.html'">📝 Open New Account</button>
  <button onclick="location.href='Find My Account.html'">🔍 Find My Account</button>
  <button onclick="location.href='login.html'">🔐 Login</button>

  <div class="small">© 2025 Bitcoin Portal | Educational System</div>
</div>

</body>
</html>
