<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC Login</title>
<style>
:root{--bg:#0b0b0b;--glass:rgba(255,255,255,.08);--gold:#f0c24b}
*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{
  margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#050506,#141416 70%);
  color:#fff;overflow:hidden;
}
.bg{position:fixed;inset:0;opacity:.04;
  background-image:url('https://cryptologos.cc/logos/bitcoin-btc-logo.png');
  background-repeat:repeat;background-size:120px;
  animation:move 25s linear infinite}
@keyframes move{from{background-position:0 0}to{background-position:1500px 1500px}}
.card{
  width:340px;padding:22px;border-radius:14px;
  background:var(--glass);box-shadow:0 6px 30px rgba(0,0,0,.7);
  backdrop-filter:blur(6px)
}
h2{color:var(--gold);margin:0 0 14px;text-align:center}
input,button{
  width:100%;padding:10px;margin:8px 0;border-radius:8px;border:0;
  background:rgba(255,255,255,.06);color:#fff
}
button{
  background:var(--gold);color:#000;font-weight:700;cursor:pointer;
  transition:.3s
}
button:hover{transform:scale(1.03)}
.msg{height:18px;text-align:center;font-size:14px;margin-top:6px}
.small{font-size:13px;color:#ddd;margin-top:6px;text-align:center}
</style>
</head>
<body>
<div class="bg"></div>

<div class="card">
  <h2>Bitcoin Portal — Login</h2>
  <input id="accno" placeholder="Account Number (e.g. BTC123456)">
  <input id="pin" placeholder="4-digit PIN" inputmode="numeric" maxlength="4">
  <button id="btnLogin">Login</button>
  <div class="msg" id="msg"></div>
  <div class="small">No account? <a style="color:var(--gold)" href="register.html">Register</a></div>
</div>

<script>
function loadUsers(){
  try{return JSON.parse(localStorage.getItem('btc_customers')||'[]')}
  catch(e){return []}
}

const msg = document.getElementById('msg');

document.getElementById('btnLogin').onclick = ()=>{
  const acc = document.getElementById('accno').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const users = loadUsers();
  const user = users.find(u => u.accountNo === acc && String(u.pin) === pin);

  if(!user){
    msg.style.color='salmon';
    msg.textContent='Invalid account or PIN';
    return;
  }

  // ✅ Save login session
  localStorage.setItem('btc_active', JSON.stringify(user));

  // ✅ Redirect to home page
  msg.style.color='#b9f6c1';
  msg.textContent='Login successful! Redirecting...';
  setTimeout(()=>{ window.location.href = 'home.html'; }, 1000);
};
</script>
</body>
</html>
