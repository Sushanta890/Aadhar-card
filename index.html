<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bitcoin Portal — Dashboard</title>
<style>
:root{
  --bg1:#050505;
  --bg2:#141416;
  --gold:#f0c24b;
  --glass:rgba(255,255,255,.08);
}

*{box-sizing:border-box;font-family:Inter,system-ui,Arial;margin:0;padding:0;}
body{
  height:100vh;
  display:flex;
  overflow:hidden;
  color:#fff;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  background-size:400% 400%;
  animation:gradFlow 10s ease infinite;
}

/* --- Animated Background Gradient --- */
@keyframes gradFlow {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* --- Sidebar --- */
.sidebar{
  width:240px;
  background:var(--glass);
  backdrop-filter:blur(10px);
  box-shadow:0 6px 25px rgba(0,0,0,.7);
  padding:25px 20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  border-right:1px solid rgba(255,255,255,.1);
  animation:slideIn 1s ease-out;
}
@keyframes slideIn{
  from{transform:translateX(-100px);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}

/* --- Logo --- */
.logo{
  text-align:center;
  color:var(--gold);
  font-weight:800;
  font-size:1.5em;
  letter-spacing:1px;
  text-shadow:0 0 10px var(--gold);
  animation:floatLogo 3s ease-in-out infinite;
}
@keyframes floatLogo{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

/* --- Buttons --- */
.nav button{
  width:100%;
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:12px;
  margin:8px 0;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
  box-shadow:0 0 10px rgba(240,194,75,.3);
}
.nav button:hover{
  background:var(--gold);
  color:#000;
  transform:scale(1.05);
  box-shadow:0 0 20px var(--gold);
}

/* --- Footer --- */
.footer{
  font-size:12px;
  color:#aaa;
  text-align:center;
  opacity:.8;
}

/* --- Main Content --- */
.main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  animation:fadeIn 1.5s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:scale(0.9);}
  to{opacity:1;transform:scale(1);}
}
.main h1{
  background:linear-gradient(90deg,var(--gold),#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-size:2.3em;
  font-weight:800;
  text-shadow:0 0 15px rgba(240,194,75,.4);
}
.main p{
  color:#ccc;
  margin-top:10px;
  max-width:420px;
  line-height:1.6;
}

/* --- Floating BTC Background Icons --- */
.bg{
  position:fixed;
  inset:0;
  background-image:url('https://cryptologos.cc/logos/bitcoin-btc-logo.png');
  background-size:120px;
  background-repeat:repeat;
  opacity:.04;
  animation:bgMove 25s linear infinite;
  z-index:-1;
}
@keyframes bgMove{
  from{background-position:0 0;}
  to{background-position:1500px 1500px;}
}
</style>
</head>
<body>
<div class="bg"></div>

<div class="sidebar">
  <div>
    <div class="logo">₿ Bitcoin Portal</div>
    <div class="nav">
      <button onclick="location.href='bank/index.html'">🏦 Bank Dashboard</button>
      <button onclick="location.href='customer/Customer Home.html'">👤 Customer Home</button>
      <button onclick="location.href='bitcoin_to_inr.html'">💱 BTC ⇄ INR Converter</button>
      <button onclick="location.href='Personal/personal_login.html'">🔐 Personal Login</button>
    </div>
  </div>
  <div class="footer">© 2025 Bitcoin Portal</div>
</div>

<div class="main">
  <div>
    <h1>Welcome to Bitcoin Portal</h1>
    <p>Manage Bitcoin and INR transactions, bank data, and customer operations — all in one secure, animated digital portal.</p>
  </div>
</div>

</body>
</html>
