<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot PIN or Account</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#050506,#141416 70%);color:#fff;font-family:Inter,system-ui,Arial;}
.card{width:340px;padding:25px;border-radius:14px;background:rgba(255,255,255,.06);backdrop-filter:blur(6px);text-align:center;}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:0;background:rgba(255,255,255,.07);color:#fff;text-align:center;}
button{background:#f0c24b;color:#000;font-weight:700;border:0;border-radius:8px;padding:10px 0;width:100%;cursor:pointer;}
.msg{margin-top:10px;height:20px;font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <h2>Recover Account</h2>
    <input id="mobile" placeholder="Enter Registered Mobile" inputmode="numeric">
    <button id="btnFind">Show Details</button>
    <div class="msg" id="msg"></div>
  </div>

<script>
function loadUsers(){ try { return JSON.parse(localStorage.getItem('btc_users')||'[]') } catch(e){return []} }

document.getElementById('btnFind').addEventListener('click', ()=>{
  const mobile = document.getElementById('mobile').value.trim()
  const msg = document.getElementById('msg')
  const users = loadUsers()
  const user = users.find(u=>u.mobile===mobile)
  if(!user){ msg.style.color='salmon'; msg.textContent='Mobile not found'; return }
  msg.style.color='#b9f6c1'
  msg.textContent = `Account: ${user.accountNo} | PIN: ${user.pin || 'Not Set'}`
})
</script>
</body>
</html>
