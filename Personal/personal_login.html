<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Personal Login — Bitcoin Portal</title>
<style>
:root{
  --bg1:#050505;--bg2:#141416;--gold:#f0c24b;--glass:rgba(255,255,255,.08);
}
*{box-sizing:border-box;font-family:Inter,system-ui,Arial;}
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:#fff;
  background-size:400% 400%;
  animation:gradFlow 10s ease infinite;
}
@keyframes gradFlow{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
.card{
  width:320px;
  background:var(--glass);
  backdrop-filter:blur(8px);
  border-radius:18px;
  padding:30px 25px;
  box-shadow:0 8px 35px rgba(0,0,0,.7);
  text-align:center;
}
h2{
  color:var(--gold);
  margin-bottom:20px;
  text-shadow:0 0 10px var(--gold);
}
input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin:8px 0 18px;
  text-align:center;
  font-size:1em;
  outline:none;
}
button{
  width:100%;
  background:var(--gold);
  color:#000;
  border:none;
  padding:12px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  transform:scale(1.05);
}
#createBtn{
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  margin-top:10px;
}
#createBtn:hover{
  background:var(--gold);
  color:#000;
}
#error{
  color:#ff6b6b;
  margin-top:10px;
  font-size:14px;
}
</style>
</head>
<body>

<div class="card">
  <h2>🔐 Personal Login</h2>
  <input type="password" id="pin" maxlength="4" placeholder="Enter 4-Digit PIN">
  <button onclick="checkPIN()">Login</button>
  <div id="error"></div>
</div>

<script>
function checkPIN(){
  const pinInput = document.getElementById('pin').value.trim();

  if(pinInput === ''){
    document.getElementById('error').textContent = "⚠️ Please enter your PIN!";
    return;
  }

  if(pinInput === '5629'){
    // ✅ Correct PIN
    location.href = 'Personal Home.html';
  } else {
    // ❌ Wrong PIN
    document.getElementById('error').textContent = "❌ Incorrect PIN!";
  }
}
</script>

</body>
</html>
