<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bitcoin → INR Converter</title>
<style>
  :root {--bg:#0b0b0b;--glass:rgba(255,255,255,.07);--gold:#f0c24b}
  *{box-sizing:border-box;font-family:Inter,system-ui,Arial}
  body{
    margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#050506,#151518 70%);
    color:#fff;overflow:hidden;
  }
  .bg{
    position:fixed;inset:0;opacity:.04;
    background-image:url('https://cryptologos.cc/logos/bitcoin-btc-logo.png');
    background-repeat:repeat;background-size:120px;
    animation:move 25s linear infinite;
  }
  @keyframes move{from{background-position:0 0}to{background-position:1500px 1500px}}
  .card{
    width:360px;padding:22px;border-radius:14px;
    background:var(--glass);
    box-shadow:0 6px 30px rgba(0,0,0,.7);
    backdrop-filter:blur(6px);
  }
  h2{color:var(--gold);margin:0 0 14px;text-align:center}
  input,button{
    width:100%;padding:10px;margin:8px 0;border-radius:8px;border:0;
    background:rgba(255,255,255,.06);color:#fff;
  }
  button{background:var(--gold);color:#000;font-weight:700;cursor:pointer}
  .msg{height:18px;text-align:center;font-size:14px;margin-top:6px}
  .result{
    text-align:center;margin-top:16px;padding:12px;
    border-radius:10px;background:rgba(255,255,255,.05);
  }
  .fade{animation:fadeIn .8s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <h2>Bitcoin → INR</h2>
    <input id="accountNo" placeholder="Enter Account Number">
    <input id="customerId" placeholder="Enter Customer ID">
    <button id="btnShow">Show Balance in INR</button>
    <div class="msg" id="msg"></div>
    <div id="result" class="result" style="display:none"></div>
  </div>

<script>
function loadUsers(){
  try { return JSON.parse(localStorage.getItem('btc_users')||'[]') }
  catch(e){return []}
}

document.getElementById('btnShow').addEventListener('click',()=>{
  const acc = document.getElementById('accountNo').value.trim()
  const cid = document.getElementById('customerId').value.trim()
  const msg = document.getElementById('msg')
  const result = document.getElementById('result')

  msg.textContent=''
  result.style.display='none'

  if(!acc||!cid){ msg.style.color='salmon'; msg.textContent='Enter both fields'; return }

  const users = loadUsers()
  const user = users.find(u=>u.accountNo===acc && u.id===cid)

  if(!user){ msg.style.color='salmon'; msg.textContent='Account not found'; return }

  msg.style.color='#b9f6c1'; msg.textContent='Account found!'

  // Simulated conversion (1 BTC = 45,00,000 INR)
  const btcRate = 4500000
  const btcBalance = (user.balance || 0).toFixed(6)
  const inrValue = (user.balance * btcRate).toLocaleString('en-IN')

  result.innerHTML = `
    <div class="fade">
      <h3 style="color:var(--gold)">Account Details</h3>
      <p><b>Name:</b> ${user.fname} ${user.lname}</p>
      <p><b>Account No:</b> ${user.accountNo}</p>
      <p><b>Customer ID:</b> ${user.id}</p>
      <p><b>BTC Balance:</b> ${btcBalance} ₿</p>
      <p><b>INR Value:</b> ₹${inrValue}</p>
    </div>`
  result.style.display='block'
})
</script>
</body>
</html>
